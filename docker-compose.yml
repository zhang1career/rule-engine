version: '3.8'

services:
  rule_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rule_engine
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RULE_ENGINE_ENV: PRODUCTION
      RULE_EVENT_RULES_CACHE_ENABLED: true
      RULE_CONTENT_CACHE_ENABLED: true
      RULE_EVAL_CACHE_CAPACITY: 10000
      RULE_EVAL_CACHE_TTL: 300
      RULE_EVAL_CACHE_KEY_LENGTH: 32
      RULE_LOG_ASYNC_ENABLED: true
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: zhang
      MYSQL_PASS: 123456
      MYSQL_ROOT_PASSWORD: rootpw
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_DB: 0
      KAFKA_HOST: kafka
      KAFKA_PORT: 9093
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/rule_engine
      JAVA_OPTS: -Xms128m -Xmx1024m -XX:MaxMetaspaceSize=128m -XX:MetaspaceSize=64m -XX:MaxDirectMemorySize=16m -XX:+UseG1GC
    ports:
      - "10080:8080"
    volumes:
      - ./docker/log:/var/log/rule_engine
    networks:
      - infrastructure_infrastructure

networks:
  infrastructure_infrastructure:
    external: true
