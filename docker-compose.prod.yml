version: '3.8'

services:
  rule-engine-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rule-engine-prod
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # MySQL Configuration (使用环境变量，方便外部配置)
      MYSQL_HOST: ${MYSQL_HOST:-mysql-prod}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASS: ${MYSQL_PASS}

      # Redis Configuration (optional)
      REDIS_HOST: ${REDIS_HOST:-redis-prod}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}

      # RabbitMQ Configuration (optional)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-prod}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # JVM Options
      JAVA_OPTS: "-Xmx1g -Xms512m"

    volumes:
      # 挂载日志目录到宿主机
      - ./logs/prod:/var/log/rule-engine

    depends_on:
      - mysql-prod
      - redis-prod
      - rabbitmq-prod

    networks:
      - rule-engine-network

    restart: unless-stopped

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  mysql-prod:
    image: mysql:8.0
    container_name: mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rule_engine
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - rule-engine-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  redis-prod:
    image: redis:7-alpine
    container_name: redis-prod
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - rule-engine-network
    restart: unless-stopped

  rabbitmq-prod:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - rule-engine-network
    restart: unless-stopped

volumes:
  mysql_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:

networks:
  rule-engine-network:
    driver: bridge
