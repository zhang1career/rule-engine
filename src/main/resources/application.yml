server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rule-engine

  profiles:
    active: gray

  # Kafka configuration
#  kafka:
#    bootstrap-servers: localhost:9092
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.apache.kafka.common.serialization.StringSerializer
# If Kafka is not configured, you can comment out the above configuration, message sending will be skipped

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: # Optional, set if Redis requires password
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

# MyBatis Plus configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Rule engine configuration
rule:
  engine:
    # Environment type: DEV (development environment), TEST (test environment), GRAY (gray environment) or PRODUCTION (production environment)
    environment: TEST
    # RabbitMQ configuration
    rabbitmq:
      exchange: rule.engine.exchange
      routing-key: rule.eval.result
    # Kafka configuration
    kafka:
      topic: rule.eval.result
  content:
    cache:
      # Enable/disable rule content caching
      enabled: ${RULE_CONTENT_CACHE_ENABLED:true}

# Logging configuration
logging:
  level:
    root: INFO
    lab.zhang.rule: DEBUG
    # Database operation logs
    com.baomidou.mybatisplus: INFO
    org.springframework.jdbc: INFO
    # Redis operation logs
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # File output configuration
  file:
    name: logs/rule-engine.log
  # Logback configuration (if using logback-spring.xml, this will be overridden)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

