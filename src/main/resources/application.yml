server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rule-engine
  
  # RabbitMQ configuration (optional, if not configured, messages will not be sent)
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest
#    virtual-host: /
    # If RabbitMQ is not configured, you can comment out the above configuration, message sending will be skipped

  # Database configuration (optional, if SQL query functionality is not needed, can be omitted)
  datasource:
    url: jdbc:mysql://localhost:3306/rule_engine?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # If database is not configured, you can comment out the above configuration, SQL query functionality will be unavailable

# Rule engine configuration
rule:
  engine:
    # Environment type: TEST (test environment) or PRODUCTION (production environment)
    environment: TEST
    # RabbitMQ configuration
    rabbitmq:
      exchange: rule.engine.exchange
      routing-key: rule.eval.result

# Logging configuration
logging:
  level:
    root: INFO
    lab.zhang.rule: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

