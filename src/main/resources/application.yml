server:
  port: 8080
  servlet:
    context-path: /
  compression:
    # Enable HTTP response compression
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    # MIME types to compress
    mime-types: ${SERVER_COMPRESSION_MIME_TYPES:application/json,application/xml,text/html,text/xml,text/plain}
    # Minimum response size to trigger compression (bytes)
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:1024}

# Rule engine configuration
rule:
  engine:
    # Environment type: DEV (development), TEST (test), GRAY (gray) or PRODUCTION (production)
    environment: TEST
    # Kafka configuration
    kafka:
      topic: rule.eval.result
  event-rules:
    cache:
      # Enable/disable event-rules caching
      enabled: ${RULE_EVENT_RULES_CACHE_ENABLED:true}
      capacity: ${RULE_EVENT_RULES_CACHE_CAPACITY:1000}
      ttl: ${RULE_EVENT_RULES_CACHE_TTL:60}
  content:
    cache:
      # Enable/disable rule content caching
      enabled: ${RULE_CONTENT_CACHE_ENABLED:true}
  eval:
    cache:
      capacity: ${RULE_EVAL_CACHE_CAPACITY:10000}
      ttl: ${RULE_EVAL_CACHE_TTL:60}
      key:
        length: ${RULE_EVAL_CACHE_KEY_LENGTH:32}
    reactive:
      # Enable reactive non-blocking eval endpoint
      # Endpoint: POST /api/eval/reactive
      enabled: ${RULE_EVAL_REACTIVE_ENABLED:true}
  cache:
    warmup:
      # Enable/disable cache warmup on startup
      enabled: ${RULE_CACHE_WARMUP_ENABLED:true}
      # Maximum number of events to warm up
      event-limit: ${RULE_CACHE_WARMUP_EVENT_LIMIT:100}
      # Maximum number of rules to warm up
      rule-limit: ${RULE_CACHE_WARMUP_RULE_LIMIT:1000}
  log:
    async:
      # Enable async log writing
      enabled: ${RULE_LOG_ASYNC_ENABLED:true}
      # Thread pool size for async log writing
      thread-pool-size: ${RULE_LOG_ASYNC_THREAD_POOL_SIZE:10}
      # Queue capacity for async log writing
      queue-capacity: ${RULE_LOG_ASYNC_QUEUE_CAPACITY:1000}
    batch:
      # Enable batch log insertion
      enabled: ${RULE_LOG_BATCH_ENABLED:true}
      # Batch size for log insertion
      batch-size: ${RULE_LOG_BATCH_SIZE:100}
      # Flush interval in milliseconds
      flush-interval-ms: ${RULE_LOG_BATCH_FLUSH_INTERVAL_MS:1000}

# Spring Boot configuration
spring:
  application:
    name: rule-engine

  profiles:
    active: gray

  # Disable RabbitMQ auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # Kafka configuration
#  kafka:
#    bootstrap-servers: localhost:9092
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.apache.kafka.common.serialization.StringSerializer
# If Kafka is not configured, you can comment out the above configuration, message sending will be skipped

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: # Optional, set if Redis requires password
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

  # Database connection pool configuration (HikariCP)
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_THRESHOLD:60000}

# MyBatis Plus configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Logging configuration
logging:
  level:
    root: INFO
    lab.zhang.rule: INFO
    # Database operation logs
    com.baomidou.mybatisplus: INFO
    org.springframework.jdbc: INFO
    # Redis operation logs
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{0} - %msg%n"
  # File output configuration
  file:
    name: logs/rule-engine.log
  # Logback configuration (if using logback-spring.xml, this will be overridden)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

