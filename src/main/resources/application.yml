server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rule-engine
  
  # RabbitMQ configuration (optional, if not configured, messages will not be sent)
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest
#    virtual-host: /
    # If RabbitMQ is not configured, you can comment out the above configuration, message sending will be skipped

  # Kafka configuration (optional, if not configured, messages will not be sent)
#  kafka:
#    bootstrap-servers: localhost:9092
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # If Kafka is not configured, you can comment out the above configuration, message sending will be skipped

  # Database configuration
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rule_engine?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: zhang
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: # Optional, set if Redis requires password
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

# MyBatis Plus configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Rule engine configuration
rule:
  engine:
    # Environment type: TEST (test environment) or PRODUCTION (production environment)
    environment: TEST
    # RabbitMQ configuration
    rabbitmq:
      exchange: rule.engine.exchange
      routing-key: rule.eval.result
    # Kafka configuration
    kafka:
      topic: rule.eval.result

# Logging configuration
logging:
  level:
    root: INFO
    lab.zhang.rule: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

