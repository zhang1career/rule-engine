# Production environment configuration
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/rule_engine?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

rule:
  engine:
    environment: PRODUCTION

# Production logging configuration (overrides main application.yml)
logging:
  level:
    root: INFO
    lab.zhang.rule: INFO
    # Third-party library logs (reduce noise in production)
    com.baomidou.mybatisplus: WARN
    org.springframework.jdbc: WARN
    org.springframework.data.redis: WARN
    org.springframework.web: INFO
  # Production log files
  file:
    name: /var/log/rule-engine/rule-engine.log

