# Production environment configuration
rule:
  engine:
    environment: PRODUCTION

# Production logging configuration (overrides main application.yml)
logging:
  level:
    root: INFO
    lab.zhang.rule: INFO
    # Third-party library logs (reduce noise in production)
    com.baomidou.mybatisplus: WARN
    org.springframework.jdbc: WARN
    org.springframework.data.redis: WARN
    org.springframework.web: INFO
  # Production log files
  file:
    name: /var/log/rule_engine/app.log

