# Test environment configuration
# Note: Set to GRAY to allow AB_TEST rules to execute in integration tests
rule:
  engine:
    environment: GRAY

spring:
  # Test database configuration
  # Option 1: Use real MySQL database (requires MySQL running)
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rule_engine_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: zhang
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Option 2: Use H2 in-memory database (no MySQL required)
  # Uncomment below and comment out MySQL config above
  # datasource:
  #   url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:

  rabbitmq:
    # Test environment does not connect to real RabbitMQ
    host: localhost
    port: 5672

# MyBatis Plus configuration for tests
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-prefix: "DAO."
  global-config:
    db-config:
      id-type: auto
  # 开启 MyBatis-Plus 的 SQL 分析和性能监控
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: WARN
    lab.zhang.rule: DEBUG
    org.springframework.jdbc: DEBUG
    # MyBatis-Plus SQL 日志
    com.baomidou.mybatisplus: DEBUG
    # MyBatis SQL 日志
    org.apache.ibatis: DEBUG
    # 更详细的 SQL 参数和结果日志
    org.apache.ibatis.logging.stdout.StdOutImpl: DEBUG

