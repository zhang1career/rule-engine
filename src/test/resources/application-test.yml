# Test environment configuration
# Note: Set to GRAY to allow AB_TEST rules to execute in integration tests
rule:
  engine:
    environment: GRAY
  content:
    cache:
      enabled: true

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rule_engine_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: zhang
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis configuration for tests
  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # Use database 1 for tests to avoid conflicts with main app
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

# MyBatis Plus configuration for tests
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-prefix: "DAO."
  global-config:
    db-config:
      id-type: auto
  # 开启 MyBatis-Plus 的 SQL 分析和性能监控
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: INFO
    lab.zhang.rule: DEBUG
    org.springframework.jdbc: DEBUG
    # MyBatis-Plus SQL 日志
    com.baomidou.mybatisplus: DEBUG
    # MyBatis SQL 日志
    org.apache.ibatis: DEBUG
    # 更详细的 SQL 参数和结果日志
    org.apache.ibatis.logging.stdout.StdOutImpl: DEBUG
  file:
    name: logs/rule-engine.log
