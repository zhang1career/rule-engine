# Rule engine configuration
rule:
  engine:
    environment: GRAY
  content:
    cache:
      # Enable/disable rule content caching
      enabled: ${RULE_CONTENT_CACHE_ENABLED:true}
  eval:
    cache:
      capacity: ${RULE_EVAL_CACHE_CAPACITY:10000}
      ttl: ${RULE_EVAL_CACHE_TTL:60}
      key:
        length: ${RULE_EVAL_CACHE_KEY_LENGTH:32}

# MyBatis Plus configuration for tests
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-prefix: "DAO."
  global-config:
    db-config:
      id-type: auto
  # 开启 MyBatis-Plus 的 SQL 分析和性能监控
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: INFO
    lab.zhang.rule: DEBUG
    org.springframework.jdbc: DEBUG
    # MyBatis-Plus SQL 日志
    com.baomidou.mybatisplus: DEBUG
    # MyBatis SQL 日志
    org.apache.ibatis: DEBUG
    # 更详细的 SQL 参数和结果日志
    org.apache.ibatis.logging.stdout.StdOutImpl: DEBUG
  file:
    name: logs/rule-engine.log
