version: '3.8'

services:
  rule-engine-gray:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rule-engine-gray
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: gray

      # MySQL Configuration
      MYSQL_HOST: mysql-host
      MYSQL_PORT: 3306
      MYSQL_USER: rule_engine_user
      MYSQL_PASS: your_mysql_password

      # Redis Configuration (optional)
      REDIS_HOST: redis-host
      REDIS_PORT: 6379
      REDIS_PASSWORD: your_redis_password
      REDIS_DB: 0

      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m"

    volumes:
      # 挂载日志目录到宿主机
      - ./logs/gray:/var/log/rule-engine/gray

    depends_on:
      - mysql-gray
      - redis-gray

    networks:
      - rule-engine-network

    restart: unless-stopped

  mysql-gray:
    image: mysql:8.0
    container_name: mysql-gray
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: rule_engine
      MYSQL_USER: rule_engine_user
      MYSQL_PASSWORD: your_mysql_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_gray_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - rule-engine-network
    command: --default-authentication-plugin=mysql_native_password

  redis-gray:
    image: redis:7-alpine
    container_name: redis-gray
    ports:
      - "6379:6379"
    volumes:
      - redis_gray_data:/data
    networks:
      - rule-engine-network

volumes:
  mysql_gray_data:
  redis_gray_data:

networks:
  rule-engine-network:
    driver: bridge
