# Load Test Configuration for Eval API
# Defines API interface and data generation rules for load testing the /api/eval endpoint

# API Interface Definition
api:
  name: "Eval API"
  method: "POST"
  path: "/api/eval"
  base_url: "http://localhost:8080"
  full_url: "http://localhost:8080/api/eval"
  description: "Rule evaluation interface (HTTP synchronous blocking)"
  headers:
    Content-Type: "application/json"
  timeout: 30

# Request Data Structure and Generation Rules
request_schema:
  # Root level fields
  fields:
    # User ID field
    userId:
      type: "LONG"
      required: true
      description: "User ID (required, must be positive)"
      generation:
        method: "increment"
        start: 1000000
        step: 1

    # Event ID field
    eventId:
      type: "LONG"
      required: true
      description: "Event ID (required, unsigned long integer, must be positive)"
      generation:
        method: "fixed"
        value: 1001

    # Trace ID field
    traceId:
      type: "LONG"
      required: true
      description: "Business request trace ID (required)"
      generation:
        method: "increment"
        start: 1000000
        step: 1

    # Arguments field (nested object)
    arguments:
      type: "OBJECT"
      required: true
      description: "Parameter dictionary for rule calculation (required)"
      # Nested fields within arguments
      fields:
        # Amount parameter
        amount:
          type: "DECIMAL"
          required: false
          description: "Transaction amount"
          generation:
            method: "random_float"
            min: 100.0
            max: 10000.0
            precision: 2

        # Age parameter
        age:
          type: "INTEGER"
          required: false
          description: "User age"
          generation:
            method: "random_int"
            min: 18
            max: 80

        # VIP status parameter
        isVip:
          type: "BOOLEAN"
          required: false
          description: "Whether user is VIP"
          generation:
            method: "random_choice"
            values: [true, false]

        # Name parameter
        name:
          type: "STRING"
          required: false
          description: "User name"
          generation:
            method: "template"
            template: "User_{userId}"

# Generation Method Reference
# Supported generation methods:
#   - fixed: Use a fixed value
#   - increment: Increment from start value with step
#   - random_int: Random integer between min and max
#   - random_float: Random float between min and max with precision
#   - random_choice: Random selection from a list of values
#   - template: String template with variable substitution (e.g., "User_{userId}")
#   - list: Sequential selection from a list (cycles through)
</contents>
</xai:function_call ><xai:function_call name="run_terminal_cmd">
<parameter name="command">python3 load_test_eval.py --config scripts/config/load_test_eval_config.yaml --concurrent 1 --total 1